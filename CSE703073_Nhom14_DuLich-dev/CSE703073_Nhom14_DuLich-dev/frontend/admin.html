<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Hệ Thống (/admin) | AccessTravel - Nhóm 14</title>
    <link rel="stylesheet" href="css/tokens.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="brand-logo"><span class="brand-flag">♿</span><span>AccessTravel Admin</span></a>
        <nav class="nav-links">
            <a href="index.html">← Về Trang chủ</a>
            <button id="btnThemeToggle" onclick="toggleAccessibilityTheme()" class="btn btn-a11y">♿ Chế Độ Người Cao Tuổi (Chữ To)</button>
            <div id="navAuthArea"></div>
        </nav>
    </header>

    <div class="container" style="margin-top:36px;" id="adminContentArea"></div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = getCurrentUser();
            const box = document.getElementById('adminContentArea');

            if (!user || user.role !== 'admin') {
                const roleName = user ? user.role.toUpperCase() : 'GUEST - CHƯA ĐĂNG NHẬP';
                box.innerHTML = '<div style="background:#fef2f2; border:2px solid #dc2626; color:#991b1b; padding:40px; border-radius:18px; text-align:center; max-width:680px; margin:0 auto;">' +
                    '<div style="font-size:48px; margin-bottom:10px;">🚫 403 FORBIDDEN</div>' +
                    '<h1 style="font-size:26px; margin-bottom:12px;">Từ Chối Truy Cập Trái Phép!</h1>' +
                    '<p style="font-size:18px; margin-bottom:24px;">Tài khoản hiện tại của bạn (<strong>' + roleName + '</strong>) không có quyền truy cập vào phân hệ Quản trị <code>/admin</code>.</p>' +
                    '<a href="login.html" class="btn btn-primary">Chuyển tới Trang Đăng Nhập</a>' +
                '</div>';
                return;
            }

            box.innerHTML = '<div style="background:var(--color-bg-card); border:1px solid var(--color-border); padding:32px; border-radius:18px; box-shadow:var(--shadow-card);">' +
                '<span class="verified-pill" style="margin-bottom:10px;">🛡️ QUYỀN QUẢN TRỊ VIÊN (ROLE: ADMIN)</span>' +
                '<h1 style="font-size:28px; margin-bottom:8px;">Bảng Điều Khiển Quản Trị Dữ Liệu Điểm Đến</h1>' +
                '<p style="color:var(--color-text-muted); margin-bottom:20px;">Quản trị trọn thao tác (Thêm, Sửa, Xóa) đối với thực thể trọng tâm accessible_destinations (≥ 105 bản ghi).</p>' +
                '<div style="display:flex; gap:12px; margin-bottom:20px;">' +
                    '<button onclick="alert(\'Mở biểu mẫu Thêm mới điểm đến trợ năng\')" class="btn btn-primary">+ Thêm Điểm Đến Mới</button>' +
                    '<a href="index.html" class="btn btn-outline">Quản lý trực tiếp trên Danh mục</a>' +
                '</div>' +
            '</div>';
        });
    </script>
</body>
</html>
