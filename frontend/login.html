<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống | AccessTravel - Nhóm 14</title>
    <link rel="stylesheet" href="css/tokens.css">
    <style>
        .login-box { max-width: 520px; margin: 48px auto; background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--border-radius-card); padding: 36px; box-shadow: var(--shadow-card); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 6px; }
        .form-input { width: 100%; min-height: var(--touch-target-min); padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--color-border); font-size: var(--font-size-base); background: var(--color-bg-main); color: var(--color-text-main); }
        .quick-roles { margin-top: 24px; padding-top: 18px; border-top: 1px dashed var(--color-border); }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="brand-logo"><span class="brand-flag">♿</span><span>AccessTravel</span></a>
        <nav class="nav-links">
            <a href="index.html">Trang chủ</a>
            <button id="btnThemeToggle" onclick="toggleAccessibilityTheme()" class="btn btn-a11y">♿ Chế Độ Người Cao Tuổi (Chữ To)</button>
        </nav>
    </header>

    <div class="container">
        <div class="login-box">
            <h1 style="font-size:26px; margin-bottom:8px;">Đăng Nhập Tài Khoản (Mốc M1)</h1>
            <p style="color:var(--color-text-muted); margin-bottom:20px;">Xác thực phiên làm việc và phân quyền theo vai trò người dùng.</p>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email hoặc Tên đăng nhập</label>
                    <input type="text" id="email" class="form-input" required placeholder="Nhập email (VD: admin@dulich.vn)...">
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Đăng Nhập</button>
            </form>

            <div class="quick-roles">
                <p style="font-weight:700; margin-bottom:10px; font-size:15px;">⚡ Chuyển nhanh 3 Vai trò phục vụ Quay Video Demo Mốc M1:</p>
                <div style="display:flex; flex-direction:column; gap:10px;">
                    <button onclick="quickLogin('user')" class="btn btn-outline">👤 Đăng nhập vai trò: Người dùng thường (User)</button>
                    <button onclick="quickLogin('admin')" class="btn btn-outline" style="border-color:#0d9488;">🛡️ Đăng nhập vai trò: Quản trị viên (Admin)</button>
                    <button onclick="logoutUser()" class="btn btn-outline">🚪 Chế độ Khách vãng lai (Guest - Đã đăng xuất)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function quickLogin(role) {
            const userObj = role === 'admin'
                ? { id: 1, full_name: 'Nguyễn Trung Anh', email: 'admin@accesstravel.vn', role: 'admin' }
                : { id: 2, full_name: 'Bác Nguyễn Văn Nam', email: 'nam.nguyen@gmail.com', role: 'user' };
            localStorage.setItem('accesstravel_user', JSON.stringify(userObj));
            window.location.href = 'index.html';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const isAdm = email.includes('admin');
            quickLogin(isAdm ? 'admin' : 'user');
        }
    </script>
</body>
</html>
