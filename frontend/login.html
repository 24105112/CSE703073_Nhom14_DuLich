<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống | AccessTravel</title>
    <link rel="stylesheet" href="css/tokens.css">
    <style>
        body { background-color: #f8fafc; }
        [data-theme="accessible"] body { background-color: #000000; }
        .auth-wrap { max-width: 480px; margin: 48px auto; }
        .auth-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 20px;
            padding: 36px 38px;
            box-shadow: 0 14px 35px -10px rgba(15,23,42,0.08);
        }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 14.5px; }
        .form-input {
            width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 10px;
            border: 1.5px solid var(--color-border); font-size: 15.5px;
            background: var(--color-bg-main); color: var(--color-text-main);
        }
        .quick-demo { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--color-border); }
    </style>

<style id="modern-sidebar-fix">
    /* 1. HEADER GỌN GÀNG NHƯ CŨ */
    body { padding-top: 60px !important; }
    header, .header, .navbar {
        position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important;
        height: 60px !important; background-color: var(--color-bg-card, #ffffff) !important;
        z-index: 9999 !important; display: flex !important; align-items: center !important;
        justify-content: space-between !important; padding: 0 16px !important;
        box-shadow: 0 1px 8px rgba(0,0,0,0.06) !important; border: none !important;
    }
    html[data-theme="dark"] header { background-color: #0f172a !important; border-bottom: 1px solid #334155 !important; }
    
    header > *:not(.logo):not(img):not(.hamburger-btn):not(#themeToggleBtn) { display: none !important; }
    #themeToggleBtn { margin-left: auto !important; margin-right: 16px !important; }
    
    .hamburger-btn {
        background: transparent !important; border: none !important; font-size: 24px !important;
        cursor: pointer !important; display: block !important; color: var(--color-text-main, #0f172a) !important;
        padding: 4px !important; margin: 0 !important;
    }
    html[data-theme="dark"] .hamburger-btn { color: #f8fafc !important; }

    /* 2. LỚP PHỦ ĐEN (OVERLAY) */
    .menu-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(15, 23, 42, 0.6); z-index: 99998;
        opacity: 0; visibility: hidden; transition: all 0.3s ease;
        backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    }
    .menu-overlay.show { opacity: 1; visibility: visible; }

    /* 3. MENU TRƯỢT TỪ BÊN PHẢI (SIDEBAR DRAWER) */
    .mobile-sidebar {
        position: fixed !important; top: 0 !important; right: -320px !important;
        width: 280px !important; height: 100vh !important;
        background-color: var(--color-bg-card, #ffffff) !important;
        box-shadow: -5px 0 25px rgba(0,0,0,0.15) !important;
        z-index: 99999 !important; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
        display: flex !important; flex-direction: column !important;
        padding: 20px 16px !important; overflow-y: auto !important;
    }
    html[data-theme="dark"] .mobile-sidebar { background-color: #1e293b !important; border-left: 1px solid #334155 !important; }
    .mobile-sidebar.show { right: 0 !important; }

    /* 4. STYLE CÁC NÚT BÊN TRONG SIDEBAR */
    .close-sidebar-btn {
        align-self: flex-end !important; background: transparent !important;
        border: none !important; font-size: 24px !important; cursor: pointer !important;
        color: #64748b !important; margin-bottom: 24px !important; padding: 8px !important;
        border-radius: 50% !important; display: flex !important; align-items: center !important; justify-content: center !important;
    }
    .close-sidebar-btn:active { background: #f1f5f9 !important; }
    
    .mobile-sidebar a, .mobile-sidebar button:not(.close-sidebar-btn) {
        display: block !important; width: 100% !important; text-align: left !important;
        padding: 14px 16px !important; margin-bottom: 8px !important;
        font-size: 15px !important; font-weight: 500 !important;
        border-radius: 12px !important; text-decoration: none !important;
        color: var(--color-text-main, #0f172a) !important;
        background: transparent !important; border: 1px solid transparent !important;
        transition: all 0.2s ease !important;
    }
    html[data-theme="dark"] .mobile-sidebar a, html[data-theme="dark"] .mobile-sidebar button:not(.close-sidebar-btn) { color: #f8fafc !important; }
    
    .mobile-sidebar a:active, .mobile-sidebar button:active:not(.close-sidebar-btn) { background: #f1f5f9 !important; }
    html[data-theme="dark"] .mobile-sidebar a:active, html[data-theme="dark"] .mobile-sidebar button:active:not(.close-sidebar-btn) { background: #334155 !important; }
    
    /* Làm nổi bật nút Đăng nhập / Đăng ký */
    .mobile-sidebar .btn-primary { 
        background: #0284c7 !important; color: #fff !important; 
        font-weight: 600 !important; text-align: center !important; margin-top: 16px !important;
    }
</style>
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="brand-logo"><span class="brand-flag">♿</span><span>AccessTravel</span></a>
        <nav class="nav-links">
            <a href="index.html#catalogSection">Khám phá điểm đến</a>
            <a href="index.html#trustpilotSection">Đánh giá cộng đồng</a>
            <a href="booking.html?id=1">Kiểm tra & Đặt lịch</a>
            <button id="btnThemeToggle" onclick="toggleAccessibilityTheme()" class="btn btn-a11y">Aa Chế độ Chữ lớn</button>
            <div id="navAuthArea"></div>
        </nav>
    </header>

    <div class="container auth-wrap">
        <div class="auth-card">
            <div style="display:inline-flex; align-items:center; gap:6px; background:#e0f2fe; color:#0369a1; padding:4px 12px; border-radius:99px; font-size:13px; font-weight:700; margin-bottom:10px;">
                🔑 Cổng đăng nhập thành viên & quản trị
            </div>
            <h1 style="font-size:26px; font-weight:900; margin-bottom:6px;">Đăng Nhập</h1>
            <p style="font-size:14.5px; color:var(--color-text-muted); margin-bottom:22px;">
                Đăng nhập để áp dụng hồ sơ thể trạng của gia đình và quản lý lịch giữ chỗ.
            </p>

            <div id="authAlert" style="display:none; padding:12px 16px; border-radius:10px; margin-bottom:16px; font-weight:700; font-size:14.5px;"></div>

            <form id="loginForm" onsubmit="submitLogin(event)">
                <div class="form-group">
                    <label for="loginUser">Tên đăng nhập hoặc Email</label>
                    <input type="text" id="loginUser" class="form-input" required value="user">
                </div>
                <div class="form-group">
                    <label for="loginPass">Mật khẩu</label>
                    <input type="password" id="loginPass" class="form-input" required value="123456">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; min-height:50px; border-radius:12px; font-size:16px;">
                    Đăng nhập vào hệ thống
                </button>

                <div class="quick-demo">
                    <p style="font-size:13px; font-weight:700; color:var(--color-text-muted); margin-bottom:10px;">⚡ Chọn nhanh tài khoản mẫu (Dành cho Demo):</p>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                        <button type="button" onclick="quickFill('user','123456')" class="btn btn-outline" style="font-size:13.5px; min-height:40px;">👴 Thành viên (User)</button>
                        <button type="button" onclick="quickFill('admin','123456')" class="btn btn-outline" style="font-size:13.5px; min-height:40px; color:#dc2626;">🛡️ Quản trị (Admin)</button>
                    </div>
                </div>
            </form>

            <div style="text-align:center; margin-top:22px; padding-top:18px; border-top:1px solid var(--color-border); font-size:15px;">
                Chưa có tài khoản?
                <a href="register.html" style="color:#00b67a; font-weight:800; text-decoration:none; margin-left:4px;">Đăng ký tài khoản mới →</a>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function quickFill(u, p) {
            document.getElementById('loginUser').value = u;
            document.getElementById('loginPass').value = p;
            document.getElementById('loginForm').requestSubmit();
        }

        async function submitLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            const alertBox = document.getElementById('authAlert');

            try {
                const res = await fetch('../api/login.php', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (res.ok && data.status === 'success') {
                    localStorage.setItem('at_user', JSON.stringify(data.user));
                    window.location.href = (data.user.role === 'admin') ? 'admin.html' : 'index.html';
                } else {
                    alertBox.style.display = 'block';
                    alertBox.style.background = '#fef2f2';
                    alertBox.style.color = '#991b1b';
                    alertBox.innerText = '❌ ' + (data.error || 'Sai thông tin đăng nhập!');
                }
            } catch (err) {
                alert('Lỗi kết nối máy chủ!');
            }
        }
    </script>

<script id="modern-sidebar-js">
document.addEventListener("DOMContentLoaded", function() {
    var header = document.querySelector('header') || document.querySelector('.header') || document.querySelector('.navbar');
    if(!header) return;

    if(!document.querySelector('.hamburger-btn')) {
        var btn = document.createElement('button');
        btn.className = 'hamburger-btn';
        btn.innerHTML = '☰';
        header.appendChild(btn);
    }

    var overlay = document.querySelector('.menu-overlay');
    if(!overlay) {
        overlay = document.createElement('div');
        overlay.className = 'menu-overlay';
        document.body.appendChild(overlay);
    }

    var sidebar = document.querySelector('.mobile-sidebar');
    if(!sidebar) {
        sidebar = document.createElement('div');
        sidebar.className = 'mobile-sidebar';
        
        var closeBtn = document.createElement('button');
        closeBtn.className = 'close-sidebar-btn';
        closeBtn.innerHTML = '✕';
        sidebar.appendChild(closeBtn);

        var links = header.querySelectorAll('a, button');
        links.forEach(function(el) {
            if(el.classList.contains('logo') || el.classList.contains('hamburger-btn') || el.id === 'themeToggleBtn' || el.querySelector('img')) return;
            var clone = el.cloneNode(true);
            clone.removeAttribute('style');
            sidebar.appendChild(clone);
        });
        document.body.appendChild(sidebar);
    }

    var hamburger = document.querySelector('.hamburger-btn');
    sidebar = document.querySelector('.mobile-sidebar');
    overlay = document.querySelector('.menu-overlay');
    var closeSidebar = document.querySelector('.close-sidebar-btn');

    function toggleMenu() {
        sidebar.classList.toggle('show');
        overlay.classList.toggle('show');
    }

    if(hamburger) hamburger.addEventListener('click', toggleMenu);
    if(closeSidebar) closeSidebar.addEventListener('click', toggleMenu);
    if(overlay) overlay.addEventListener('click', toggleMenu);
});
</script>
</body>
</html>
