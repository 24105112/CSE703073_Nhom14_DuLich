<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Hệ Thống | AccessTravel Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-login-card { background: #1e293b; border: 1px solid #334155; padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
        .admin-logo { font-size: 24px; font-weight: 900; color: #14b8a6; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
        .admin-input { width: 100%; background: #0f172a; border: 1px solid #334155; padding: 14px; border-radius: 8px; color: #fff; font-size: 15px; margin-bottom: 16px; outline: none; }
        .admin-input:focus { border-color: #14b8a6; }
        .btn-admin-submit { width: 100%; background: #14b8a6; color: #0f172a; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-admin-submit:hover { background: #0d9488; }
        .back-home { display: block; text-align: center; margin-top: 20px; color: #94a3b8; font-size: 14px; text-decoration: none; }
        .back-home:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="admin-login-card">
        <div class="admin-logo"><i class="fa-solid fa-shield-halved"></i> AccessTravel Admin</div>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 24px;">Khu vực kiểm soát dành riêng cho Quản trị viên hệ thống.</p>

        <form action="admin.html" method="GET">
            <label style="font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Email Quản trị</label>
            <input type="email" class="admin-input" value="admin@accesstravel.vn" required style="margin-top: 6px;">

            <label style="font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Mật khẩu bảo mật</label>
            <input type="password" class="admin-input" value="********" required style="margin-top: 6px;">

            <button type="submit" class="btn-admin-submit">Truy cập Trang Quản Trị</button>
        </form>

        <a href="index.html" class="back-home">← Quay lại trang chủ khách hàng</a>
    </div>

</body>
</html>
